<style>
html,body{margin:0;padding:0;height:100%;background:#0f172a;}
#hs-frame{border:0;width:100%;height:100%;display:block;}
/* ============================================================
   MÓDULO DE PATROCÍNIO — Hora da Segurança
   Camada 100% independente do jogo original.
   ============================================================ */

.hs-ad-backdrop{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  background:rgba(4,8,18,.78);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  opacity:0; pointer-events:none; transition:opacity .28s ease;
}
.hs-ad-backdrop.is-open{opacity:1; pointer-events:auto;}
.hs-ad-backdrop.hs-hidden{display:none;}

.hs-ad-card{
  position:relative; width:min(640px,100%); max-height:94vh; overflow:auto;
  border-radius:26px; color:#fff;
  background:
    radial-gradient(120% 90% at 90% -10%, var(--hs-brand-3,#ffd166) 0%, transparent 55%),
    linear-gradient(155deg, var(--hs-brand-1,#0b4da2) 0%, var(--hs-brand-2,#081a38) 78%);
  box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.10) inset;
  transform:translateY(26px) scale(.96); opacity:0;
  transition:transform .38s cubic-bezier(.34,1.4,.5,1), opacity .3s ease;
  font-family:'Plus Jakarta Sans','Outfit',system-ui,-apple-system,Segoe UI,sans-serif;
}
.hs-ad-backdrop.is-open .hs-ad-card{transform:translateY(0) scale(1); opacity:1;}

.hs-ad-card::before{
  content:''; position:absolute; inset:0; border-radius:26px; pointer-events:none;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px);
  mask-image:linear-gradient(180deg,#000 0%,transparent 62%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 62%);
}

.hs-ad-inner{position:relative; padding:26px 26px 22px;}

.hs-ad-eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-size:.68rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  padding:6px 12px; border-radius:999px;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
}

.hs-ad-brandrow{display:flex; align-items:center; gap:16px; margin:18px 0 6px; flex-wrap:wrap;}
.hs-ad-logo{
  height:74px; width:auto; max-width:260px; object-fit:contain;
  background:#fff; border-radius:16px; padding:10px 16px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.hs-ad-brandmeta{min-width:180px; flex:1;}
.hs-ad-brandname{display:block; font-family:'Outfit',sans-serif; font-size:1.5rem; font-weight:900; line-height:1.1;}
.hs-ad-brandseg{display:block; font-size:.82rem; opacity:.85; margin-top:3px;}

.hs-ad-headline{
  font-family:'Outfit',sans-serif; font-size:1.62rem; font-weight:900;
  line-height:1.18; margin:16px 0 8px;
}
.hs-ad-headline mark{background:var(--hs-brand-3,#ffd166); color:#111827; padding:0 8px; border-radius:7px;}
.hs-ad-claim{font-size:.98rem; line-height:1.55; opacity:.94; margin:0 0 16px;}

.hs-ad-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.hs-ad-chip{
  font-size:.78rem; font-weight:700; padding:7px 12px; border-radius:999px;
  background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.2);
}

.hs-ad-ctas{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:16px;}
@media(min-width:520px){.hs-ad-ctas{grid-template-columns:1fr 1fr;}}
.hs-ad-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 16px; border-radius:14px; text-decoration:none;
  font-weight:800; font-size:.95rem; text-align:center;
  transition:transform .16s ease, filter .16s ease;
}
.hs-ad-btn:hover{transform:translateY(-2px); filter:brightness(1.06);}
.hs-ad-btn-primary{
  background:var(--hs-brand-3,#ffd166); color:#111827;
  box-shadow:0 12px 26px rgba(0,0,0,.32);
}
.hs-ad-btn-ghost{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28);
}

.hs-ad-strip{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:12px 14px; border-radius:14px; margin-bottom:16px;
  background:rgba(0,0,0,.24); border:1px solid rgba(255,255,255,.12);
  font-size:.8rem;
}
.hs-ad-strip strong{font-size:.86rem;}
.hs-ad-strip a{color:var(--hs-brand-3,#ffd166); font-weight:800; text-decoration:none;}

.hs-ad-close{
  width:100%; border:0; cursor:pointer;
  padding:14px 18px; border-radius:14px;
  font-family:'Outfit',sans-serif; font-weight:800; font-size:1rem;
  background:#fff; color:#0f172a;
  transition:opacity .2s ease, transform .16s ease;
}
.hs-ad-close:hover{transform:translateY(-2px);}
.hs-ad-close[disabled]{opacity:.5; cursor:not-allowed; transform:none;}

.hs-ad-legal{
  margin:12px 0 0; text-align:center;
  font-size:.68rem; letter-spacing:.05em; opacity:.6;
}

/* hub */
.hub{min-height:100%;box-sizing:border-box;padding:48px 22px;font-family:'Plus Jakarta Sans',sans-serif;color:#e2e8f0;background:#0b1220;}
.hub h1{font-family:Outfit,sans-serif;font-size:1.8rem;margin:0 0 6px;text-align:center}
.hub p{opacity:.7;text-align:center;margin:0 0 30px;font-size:.95rem}
.hubgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));max-width:1080px;margin:0 auto}
.hubcard{display:block;padding:20px;border-radius:18px;text-decoration:none;color:#fff;
 background:radial-gradient(120% 90% at 90% -10%,var(--c3) 0%,transparent 55%),linear-gradient(150deg,var(--c1),var(--c2));
 box-shadow:0 16px 40px rgba(0,0,0,.4);transition:transform .18s ease}
.hubcard:hover{transform:translateY(-4px)}
.hubcard strong{display:block;font-family:Outfit,sans-serif;font-size:1.15rem;font-weight:900}
.hubcard span{font-size:.8rem;opacity:.85}
</style>
</head>

    if (!w) return false;
    if (typeof w.DefensiveDrivingApp === 'function') proto = w.DefensiveDrivingApp.prototype;
    else if (w.ddApp) proto = Object.getPrototypeOf(w.ddApp);
    if (!proto || typeof proto.avancar !== 'function') return false;
    if (proto.__hsSponsor) return true;
    proto.__hsSponsor = true;
    var av = proto.avancar, fi = proto.finalizar;
    proto.avancar = function(){
      var self = this, fase = this.currentPhase;
      if (fase < 6 && FASES.indexOf(fase) !== -1){
        abrir('Continuar para a fase '+(fase+1)+' ➔', function(){ av.call(self); });
        return;
      }
      return av.call(this);
    };
    proto.finalizar = function(){
      var self = this, args = arguments;
      abrir('Ver meu relatório final 🏆', function(){ fi.apply(self, args); });
    };
    return true;
  }
  var iv = setInterval(function(){
    if (instalar() || tentativas > 200) clearInterval(iv);
  }, 100);
  frame.addEventListener('load', instalar);
})();
</script>
